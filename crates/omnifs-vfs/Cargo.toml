[package]
name = "omnifs-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Omnifs VFS facade and optional wire transport"
categories = ["filesystem"]
keywords = ["omnifs", "vfs", "namespace", "filesystem"]

[features]
default = []
wire = ["dep:omnifs-api", "dep:postcard", "dep:tracing"]

[dependencies]
omnifs-core = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
thiserror = { workspace = true }
omnifs-api = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
