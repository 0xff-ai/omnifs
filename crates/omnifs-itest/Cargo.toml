[package]
name = "omnifs-itest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Centralized integration tests and harnesses for omnifs providers"

[dependencies]
omnifs-api = { workspace = true }
bytes = { workspace = true }
hyper-util = { workspace = true }
omnifs-engine = { workspace = true, features = ["runtime"] }
omnifs-wit = { path = "../omnifs-wit", features = ["host-bindings"] }
omnifs-core = { path = "../omnifs-core" }
omnifs-provider = { workspace = true }
omnifs-nfs = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["formatting"] }

[dev-dependencies]
omnifs-fuse = { workspace = true }
omnifs-libkrun = { workspace = true }
rusqlite = { workspace = true }
base64 = "0.22"
hickory-proto = "0.26"

[lints]
workspace = true
