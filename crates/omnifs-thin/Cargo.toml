[package]
name = "omnifs-thin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Credential-free guest frontend runner for omnifs"
categories = ["filesystem"]
keywords = ["omnifs", "filesystem", "frontend"]

[[bin]]
name = "omnifs-thin"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
omnifs-core = { workspace = true }
omnifs-mtab = { workspace = true }
omnifs-nfs = { workspace = true, default-features = false }
omnifs-vfs = { workspace = true, features = ["wire"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
omnifs-fuse = { workspace = true, default-features = false }

[lints]
workspace = true
