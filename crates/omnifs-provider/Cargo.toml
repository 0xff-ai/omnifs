[package]
name = "omnifs-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider metadata and artifact validation for Omnifs"

[dependencies]
omnifs-auth = { workspace = true }
omnifs-core = { workspace = true }
fs2 = { workspace = true }
jsonschema = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmparser = { version = "0.247", default-features = false, features = ["std", "component-model"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "dump-provider"
path = "src/bin/dump_provider.rs"

[[bin]]
name = "omnifs-provider-store-bundle"
path = "src/bin/store_bundle.rs"
