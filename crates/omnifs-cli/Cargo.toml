[package]
name = "omnifs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line interface for mounting omnifs virtual filesystems"
categories = ["filesystem", "command-line-utilities"]
keywords = ["omnifs", "fuse", "filesystem", "wasm", "cli"]

[[bin]]
name = "omnifs"
path = "src/main.rs"

[dependencies]
omnifs-core = { workspace = true }
omnifs-daemon = { workspace = true }
omnifs-bootstrap = { workspace = true }
omnifs-state = { workspace = true }
omnifs-api = { workspace = true }
omnifs-kcl = { workspace = true }
omnifs-engine = { workspace = true, features = ["runtime"] }
omnifs-thin = { workspace = true }
omnifs-auth = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
tokio-stream = { workspace = true }
hyper-util = { workspace = true }
omnifs-provider = { workspace = true }
omnifs-inspector = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = "0.10"
anstream = "1"
owo-colors = "4"
arboard = { version = "3", default-features = false }
time = { workspace = true }
webbrowser = { workspace = true }
crossterm = "0.28"
unicode-width = { workspace = true }
getrandom = "0.3"
tabled = { version = "0.20", features = ["ansi"] }

[dev-dependencies]
tempfile = { workspace = true }
insta = "1"
# Shares the cross-process NFS serialization lock (one port owner) with the
# filesystem conformance matrix. No cycle: omnifs-itest does not depend on
# omnifs-cli.
omnifs-itest = { path = "../omnifs-itest" }

[lints]
workspace = true
