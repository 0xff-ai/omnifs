syntax = "proto3";

package omnifs.control.v1;

service Control {
  rpc Ready(Empty) returns (Empty);
  rpc GetStatus(Empty) returns (StatusResponse);
  rpc GetInventory(Empty) returns (InventoryResponse);
  rpc GetDaemonInfo(Empty) returns (DaemonInfoResponse);
  rpc GetRecoveryState(Empty) returns (RecoveryResponse);
  rpc RepairState(RepairStateRequest) returns (RepairStateResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc ListProviders(Empty) returns (ListProvidersResponse);
  rpc GetProviderMetadata(GetProviderMetadataRequest) returns (GetProviderMetadataResponse);
  rpc ImportProvider(stream ImportProviderRequest) returns (ImportProviderResponse);
  rpc ImportEmbeddedProvider(ImportEmbeddedProviderRequest) returns (ImportProviderResponse);
  rpc BeginMutation(BeginMutationRequest) returns (BeginMutationResponse);
  rpc ApplyMutation(ApplyMutationRequest) returns (ApplyMutationResponse);
  rpc DropMutation(DropMutationRequest) returns (DropMutationResponse);
  rpc ListMounts(Empty) returns (ListMountsResponse);
  rpc GetMount(GetMountRequest) returns (GetMountResponse);
  rpc ListCredentials(Empty) returns (ListCredentialsResponse);
  rpc GetCredentialStatus(GetCredentialStatusRequest) returns (GetCredentialStatusResponse);
  rpc SubscribeInspector(InspectorRequest) returns (stream InspectorStreamItem);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogStreamItem);
}

message Empty {}

message StatusResponse { DaemonStatus status = 1; }
message InventoryResponse { DaemonInventory inventory = 1; }
message DaemonInfoResponse { DaemonInfo info = 1; }
message RecoveryResponse { DaemonRecovery recovery = 1; }

message RepairStateRequest {
  string instance_id = 1;
  bytes recovery_id = 2;
  RepairAction action = 3;
}
message RepairStateResponse { RepairReceipt receipt = 1; }
message ShutdownRequest { bool stop_filesystems = 1; }
message ShutdownResponse { uint32 detached = 1; repeated string still_attached = 2; }

message ListProvidersResponse { repeated ProviderEntry providers = 1; }
message GetProviderMetadataRequest { bytes provider_id = 1; }
message GetProviderMetadataResponse { ProviderMetadata metadata = 1; }

message ImportProviderRequest {
  oneof value {
    ProviderUploadStart start = 1;
    bytes chunk = 2;
  }
}
message ProviderUploadStart {
  string file_name = 1;
  uint64 total_length = 2;
  bytes digest = 3;
}
message ImportProviderResponse { ProviderImportReceipt receipt = 1; }
message ImportEmbeddedProviderRequest { string name = 1; }

message BeginMutationRequest { bytes mutation_id = 1; }
message BeginMutationResponse { uint64 lease_deadline_unix_ms = 1; }
message DropMutationRequest { bytes mutation_id = 1; }
message DropMutationResponse {}

message ApplyMutationRequest { bytes mutation_id = 1; repeated MutationOp ops = 2; }
message MutationOp {
  oneof op {
    CreateMountOp create_mount = 1;
    UpdateMountOp update_mount = 2;
    RemoveMountOp remove_mount = 3;
    SubmitCredentialOp submit_credential = 4;
    DeleteCredentialOp delete_credential = 5;
    RevokeCredentialOp revoke_credential = 6;
  }
}
message CreateMountOp { MountDefinition definition = 1; }
message UpdateMountOp { string name = 1; MountPatch patch = 2; }
message RemoveMountOp { string name = 1; }
message SubmitCredentialOp { CredentialSubmission submission = 1; }
message DeleteCredentialOp { CredentialKey key = 1; }
message RevokeCredentialOp { CredentialKey key = 1; }

message ApplyMutationResponse { repeated MutationOpResult results = 1; ServingOutcome serving = 2; }
message MutationOpResult {
  oneof result {
    MountOpResult mount = 1;
    CredentialStatus credential = 2;
  }
}
message MountOpResult { string name = 1; optional bytes version = 2; uint64 revision = 3; }
message ServingOutcome { bool serving = 1; optional string recovery_detail = 2; }

message ListMountsResponse { repeated MountRecord mounts = 1; }
message GetMountRequest { string name = 1; }
message GetMountResponse { MountRecord mount = 1; }

message ListCredentialsResponse { repeated CredentialStatus credentials = 1; }
message GetCredentialStatusRequest { CredentialKey key = 1; }
message GetCredentialStatusResponse { CredentialStatus status = 1; }

message InspectorRequest {}
message InspectorStreamItem {
  oneof value {
    InspectorReady ready = 1;
    bytes json_line = 2;
    uint64 dropped = 3;
  }
}
message InspectorReady { string instance_id = 1; }

message StreamLogsRequest { bool follow = 1; uint32 tail_lines = 2; }
message LogStreamItem {
  oneof value {
    LogsReady ready = 1;
    bytes data = 2;
  }
}
message LogsReady { string instance_id = 1; }

message ProviderReference { bytes id = 1; string name = 2; optional string version = 3; }
message ProviderMetadata { ProviderReference reference = 1; bytes manifest = 2; }
message ProviderEntry { ProviderMetadata metadata = 1; bool embedded = 2; bool retained = 3; }
enum ProviderImportDisposition { PROVIDER_IMPORT_DISPOSITION_UNSPECIFIED = 0; PROVIDER_IMPORT_INSERTED = 1; PROVIDER_IMPORT_UNCHANGED = 2; PROVIDER_IMPORT_REPAIRED = 3; }
message ProviderImportReceipt { ProviderReference provider = 1; ProviderImportDisposition disposition = 2; }

message MountDefinition { string name = 1; bytes provider = 2; MountCredential auth = 3; MountLimits limits = 4; bytes config = 5; }
message MountCredential { string scheme = 1; string account_label = 2; }
message MountLimits { optional uint32 max_memory_mb = 1; optional uint64 max_fetch_blob_bytes = 2; }
message MountPatch { optional bytes provider = 1; MountCredentialPatch auth = 2; MountLimitsPatch limits = 3; BytesPatch config = 4; }
message MountCredentialPatch { oneof value { Empty keep = 1; MountCredential set = 2; Empty clear = 3; } }
message MountLimitsPatch { oneof value { Empty keep = 1; MountLimits set = 2; Empty clear = 3; } }
message BytesPatch { oneof value { Empty keep = 1; bytes set = 2; Empty clear = 3; } }
message MountRecord { MountDefinition definition = 1; ProviderReference provider = 2; bytes version = 3; uint64 revision = 4; MountHealth health = 5; optional CredentialHealth auth_health = 6; bytes last_mutation_id = 7; }
message MountHealth {
  oneof value { Empty active = 1; Empty auth_required = 2; string provider_unavailable = 3; string failed = 4; }
}

message CredentialKey { string provider_name = 1; string scheme = 2; string account_label = 3; }
message CredentialSubmission { bytes provider = 1; string scheme = 2; string account_label = 3; CredentialMaterial material = 4; CredentialClientOverrides overrides = 5; }
message CredentialMaterial {
  oneof value { StaticTokenMaterial static_token = 1; OAuthMaterial oauth = 2; }
}
message StaticTokenMaterial { bytes token = 1; }
message OAuthMaterial {
  bytes access_token = 1;
  optional bytes refresh_token = 2;
  optional int64 expires_at_unix = 3;
  string token_type = 4;
  repeated string scopes = 5;
  optional string upstream_identity = 6;
}
message CredentialClientOverrides { optional string client_id = 1; optional bytes client_secret = 2; optional string redirect_uri = 3; optional StringList scopes = 4; }
message StringList { repeated string values = 1; }
message CredentialStatus { CredentialKey key = 1; bytes provider = 2; CredentialKind kind = 3; repeated string scopes = 4; bytes auth_fingerprint = 5; uint64 version = 6; uint64 generation = 7; CredentialStatusKind status = 8; bytes last_mutation_id = 9; }

message DaemonInfo { string version = 1; uint32 pid = 2; string instance_id = 3; bytes executable = 4; optional bytes attach_unix = 5; optional string attach_tcp = 6; }
message DaemonStatus { string version = 1; uint32 pid = 2; string instance_id = 3; bytes executable = 4; optional string attach_tcp = 5; repeated FilesystemSpec filesystems = 6; repeated MountInfo mounts = 7; DaemonHealth health = 8; optional ActiveMutation active_mutation = 9; }
message ActiveMutation { bytes mutation_id = 1; uint64 lease_deadline_unix_ms = 2; }
message DaemonInventory { DaemonInfo info = 1; DaemonPhase phase = 2; optional uint64 durable_revision = 3; optional uint64 serving_revision = 4; DaemonHealth health = 5; repeated MountRecord mounts = 6; repeated CredentialStatus credentials = 7; repeated FilesystemSpec attachments = 8; optional ActiveMutation active_mutation = 9; }
message DaemonRecovery { DaemonPhase phase = 1; optional uint64 durable_revision = 2; optional uint64 serving_revision = 3; optional bytes failed_mutation = 4; HealthReport store_health = 5; RecoveryOffer repair = 6; }
message RecoveryOffer { bytes id = 1; repeated RepairAction actions = 2; }
message RepairReceipt { string instance_id = 1; bytes recovery_id = 2; RepairAction action = 3; RepairDisposition disposition = 4; }
message HealthReport { HealthState state = 1; string message = 2; }
message DaemonHealth { HealthReport control = 1; HealthReport filesystems = 2; HealthReport mounts = 3; }
message MountInfo { string mount = 1; string provider_name = 2; string provider_id = 3; optional CredentialHealth auth_health = 4; }
message FilesystemSpec { string id = 1; FsProtocol protocol = 2; FsRuntime runtime = 3; bytes location = 4; }

enum DaemonPhase { DAEMON_PHASE_UNSPECIFIED = 0; DAEMON_STARTING = 1; DAEMON_READY = 2; DAEMON_RECOVERY_REQUIRED = 3; }
enum HealthState { HEALTH_STATE_UNSPECIFIED = 0; HEALTH_STARTING = 1; HEALTH_HEALTHY = 2; HEALTH_DEGRADED = 3; HEALTH_UNHEALTHY = 4; }
enum CredentialHealth { CREDENTIAL_HEALTH_UNSPECIFIED = 0; CREDENTIAL_READY = 1; CREDENTIAL_EXPIRING_SOON = 2; CREDENTIAL_EXPIRED = 3; CREDENTIAL_REFRESH_FAILED = 4; CREDENTIAL_NEEDS_CONSENT = 5; CREDENTIAL_MISSING = 6; CREDENTIAL_STATIC_UNVALIDATED = 7; }
enum CredentialKind { CREDENTIAL_KIND_UNSPECIFIED = 0; CREDENTIAL_STATIC_TOKEN = 1; CREDENTIAL_OAUTH = 2; }
enum CredentialStatusKind { CREDENTIAL_STATUS_KIND_UNSPECIFIED = 0; CREDENTIAL_ACTIVE = 1; CREDENTIAL_BLOCKED = 2; CREDENTIAL_PENDING_REPUBLISH = 3; CREDENTIAL_REVOCATION_PENDING = 4; CREDENTIAL_REVOCATION_UNKNOWN = 5; CREDENTIAL_DELETED = 6; }
enum RepairAction { REPAIR_ACTION_UNSPECIFIED = 0; REPAIR_RECREATE_CONTROL_STORE = 1; }
enum RepairDisposition { REPAIR_DISPOSITION_UNSPECIFIED = 0; REPAIR_FRESH_STORE_CREATED = 1; REPAIR_CORRUPT_STORE_ARCHIVED = 2; }
enum FsProtocol { FS_PROTOCOL_UNSPECIFIED = 0; FS_FUSE = 1; FS_NFS = 2; }
enum FsRuntime { FS_RUNTIME_UNSPECIFIED = 0; FS_HOST = 1; FS_DOCKER = 2; FS_LIBKRUN = 3; }
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  reserved 1, 2, 3;
  BUSY = 4;
  NOT_READY = 5;
  ERROR_RECOVERY_REQUIRED = 6;
  INVALID_REQUEST = 7;
  MUTATION_IN_PROGRESS = 8;
  LEASE_EXPIRED = 9;
  LEASE_NOT_HELD = 10;
  NOT_FOUND = 11;
  ALREADY_EXISTS = 12;
  CONFLICT = 13;
  INTERNAL = 14;
}
message ErrorDetail { ErrorCode code = 1; string message = 2; }
