nextest-version = { required = "0.9.132" }

[profile.fast]
inherits = "default"
default-filter = "kind(lib) | kind(bin)"
fail-fast = true
status-level = "fail"
final-status-level = "fail"

[profile.ci]
slow-timeout = { period = "30s" }
status-level = "slow"
final-status-level = "slow"

# Each lifecycle case starts a real daemon whose required provider compiler
# cache belongs to its private profile. Reserve the full CI test pool so those
# fixed 30-second product deadlines measure the daemon, not host-wide compile
# oversubscription from unrelated test binaries.
[[profile.ci.overrides]]
filter = "binary(lifecycle_acceptance)"
threads-required = "num-test-threads"
